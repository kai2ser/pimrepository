<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 68" fill="none">
  <defs>
    <clipPath id="inner-clip">
      <rect x="7" y="7" width="54" height="54"/>
    </clipPath>
  </defs>

  <!-- Outer black square border -->
  <rect x="0" y="0" width="68" height="68" fill="black"/>
  <!-- White inner background -->
  <rect x="7" y="7" width="54" height="54" fill="white"/>

  <!--
    Black diamond (rotated square) — center(42,42), half-diagonal 35.
    Top vertex lands on the inner top edge; left vertex on the inner left edge.
    This creates a clean white right-triangle in the upper-left of the inner area.
      Top:   (42,  7) — on inner top edge
      Right: (77, 42) — clipped to inner right (x=61)
      Bottom:(42, 77) — clipped to inner bottom (y=61)
      Left:  ( 7, 42) — on inner left edge
  -->
  <polygon
    points="42,7 77,42 42,77 7,42"
    fill="black"
    clip-path="url(#inner-clip)"
  />

  <!-- PIM — bold, tight tracking -->
  <text
    x="80" y="30"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="900"
    fill="black"
    letter-spacing="1.5"
  >PIM</text>

  <!-- PAM -->
  <text
    x="80" y="57"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="900"
    fill="black"
    letter-spacing="1.5"
  >PAM</text>

  <!-- pim-pam.net — small, regular weight -->
  <text
    x="81" y="67"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    fill="black"
    letter-spacing="0"
  >pim-pam.net</text>
</svg>
